<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>视觉反推工坊</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="studio-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="视觉反推工坊首页">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>Prompt Studio</strong>
        </a>
        <div class="connection" id="connectionStatus">
          <span class="connection-dot" aria-hidden="true"></span>
          <span>连接中</span>
        </div>
      </header>

      <section class="update-banner" id="updateBanner" aria-live="polite" hidden>
        <div class="update-signal" aria-hidden="true">
          <span class="update-pulse"></span>
          <span id="updateVersion">NEW</span>
        </div>
        <div class="update-copy">
          <strong>新版本已发布</strong>
          <span>升级后新建一个 Codex 任务即可使用。</span>
        </div>
        <div class="update-actions">
          <a id="updateReleaseLink" href="#" target="_blank" rel="noreferrer">查看版本说明</a>
          <button class="update-copy-button" id="copyUpdateButton" type="button">
            复制升级命令
          </button>
          <button
            class="update-dismiss"
            id="dismissUpdateButton"
            type="button"
            aria-label="暂时关闭版本提醒"
            title="暂时关闭"
          >
            ×
          </button>
        </div>
      </section>

      <nav class="mode-switch" aria-label="工作模式">
        <button type="button" class="mode-switch__item is-active" data-mode="reverse-prompt">
          提示词反推
        </button>
        <button type="button" class="mode-switch__item" data-mode="brand-grade">
          品牌级精修
        </button>
      </nav>

      <div data-workspace="reverse-prompt">
      <main class="workspace">
        <aside class="source-pane">
          <div class="pane-heading">
            <span class="eyebrow">IMAGE → PROMPT</span>
            <h1>看懂一张图，<br />再把它改成你的。</h1>
          </div>

          <label class="drop-zone" id="dropZone" for="imageInput">
            <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" />
            <div class="drop-empty" id="dropEmpty">
              <span class="drop-symbol" aria-hidden="true">↗</span>
              <strong>拖入或粘贴图片</strong>
              <span>也可以点击选择</span>
            </div>
            <img id="sourcePreview" alt="待分析的参考图预览" hidden />
            <span class="replace-hint" id="replaceHint" hidden>点击更换图片</span>
          </label>

          <div class="transfer-mode-control">
            <label for="transferMode">反推模式</label>
            <select id="transferMode">
              <option value="content_fidelity" selected>内容保真</option>
              <option value="style_composition">风格构图</option>
              <option value="subject_swap">主体替换</option>
            </select>
          </div>

          <label class="replacement-subject-field" id="replacementSubjectField" hidden>
            <span>替换为</span>
            <input id="replacementSubject" type="text" autocomplete="off" />
          </label>

          <div class="product-input-card" id="productInputCard">
            <label class="product-thumb" for="productInput" title="添加或更换产品图">
              <input
                id="productInput"
                type="file"
                accept="image/png,image/jpeg,image/webp"
                disabled
              />
              <span class="product-placeholder" id="productPlaceholder" aria-hidden="true">+</span>
              <img id="productPreview" alt="用于匹配特征的产品图" hidden />
            </label>
            <label class="product-copy" for="productInput">
              <strong>产品图</strong>
              <span id="productStatus">先添加参考图</span>
            </label>
            <button class="product-match-button" id="matchProductButton" type="button" disabled>
              匹配产品
            </button>
          </div>

          <div class="source-actions">
            <button class="button button-primary" id="analyzeButton" type="button" disabled>
              开始分析
            </button>
            <button class="button button-quiet" id="clearButton" type="button" disabled>
              清空
            </button>
          </div>

          <section class="analysis-experience" id="analysisExperience" aria-live="polite" hidden>
            <div class="analysis-orbit" aria-hidden="true">
              <span class="orbit-ring orbit-ring-one"></span>
              <span class="orbit-ring orbit-ring-two"></span>
              <span class="orbit-core"></span>
              <span class="orbit-satellite"></span>
            </div>
            <div class="analysis-copy">
              <div class="analysis-heading">
                <strong class="activity-state" id="activityState">图片已就绪</strong>
                <time class="analysis-elapsed" id="analysisElapsed">READY</time>
              </div>
              <p id="analysisDetail">保存在本地，尚未发送给 Codex</p>
              <ol class="activity-list" id="activityList">
                <li class="is-current">本地图片</li>
                <li>Codex 接收</li>
                <li>视觉拆解</li>
                <li>生成字段</li>
              </ol>
            </div>
          </section>
        </aside>

        <section class="recipe-pane">
          <div class="recipe-empty" id="recipeEmpty">
            <span class="empty-symbol" aria-hidden="true">⌁</span>
            <h2>分析后，在这里编辑。</h2>
            <p>视觉关系会自动拆成独立字段。</p>
          </div>

          <div class="recipe-editor" id="recipeEditor" hidden>
            <div class="recipe-header">
              <div>
                <span class="eyebrow">VISUAL RECIPE</span>
                <h2 id="recipeTitle">视觉配方</h2>
              </div>
              <span class="schema-badge">可编辑</span>
            </div>

            <div class="section-stack" id="sectionStack"></div>

            <details class="boundary-section">
              <summary>高级边界设置</summary>
              <div class="boundary-grid" id="boundaryGrid"></div>
            </details>
          </div>
        </section>
      </main>

      <footer class="export-dock" id="exportDock" hidden>
        <div class="change-summary">
          <span class="change-count" id="changeCount">暂无修改</span>
        </div>
        <button class="button button-rebuild" id="reviseButton" type="button">
          提交修改
        </button>
        <textarea id="compiledPrompt" hidden readonly></textarea>
        <div class="copy-actions">
          <button class="button button-quiet" id="copyJsonButton" type="button">复制 JSON</button>
          <button class="button button-primary" id="copyPromptButton" type="button">复制提示词</button>
        </div>
      </footer>
      </div>

      <main class="finish-workspace" data-workspace="brand-grade" hidden>
        <header class="finish-heading">
          <h1>检查成图，修到可交付。</h1>
        </header>

        <section class="finish-source">
          <label id="finish-dropzone" class="finish-dropzone" for="finish-source-input">
            <input
              id="finish-source-input"
              class="finish-file-input"
              type="file"
              accept="image/png,image/jpeg,image/webp"
            />
            <span class="finish-dropzone__mark" aria-hidden="true">↗</span>
            <strong>放入待精修成图</strong>
            <small>PNG · JPG · WEBP · 最大 20MB</small>
            <img id="finish-source-preview" alt="待精修成图预览" hidden />
          </label>
        </section>

        <section id="finish-brief" class="finish-brief" hidden>
          <div class="brief-grid">
            <label>渠道<input name="channel" placeholder="如 PDP / 社媒 / 海报" /></label>
            <label>受众<input name="audience" placeholder="核心观看者" /></label>
            <label>第一眼<input name="firstRead" placeholder="产品 / 人物 / 信息" /></label>
            <label>品牌气质<input name="brandCharacter" placeholder="如 专业、克制、温暖" /></label>
            <label>文案安全区<input name="copySafeArea" placeholder="如 右上 / 无" /></label>
          </div>
          <div id="evidence-list" class="evidence-list"></div>
          <div class="finish-brief__actions">
            <button id="add-evidence" type="button" class="button button--ghost">
              添加参考图
            </button>
            <button id="finish-analyze" type="button" class="button button--primary">
              开始品牌级诊断
            </button>
          </div>
        </section>

        <section id="finish-progress" class="finish-progress" hidden aria-live="polite">
          <span class="finish-progress__orb" aria-hidden="true"></span>
          <strong id="finish-progress-title">检查真实感</strong>
        </section>

        <section id="finish-results" class="finish-results" hidden>
          <div class="finish-section-heading finish-section-heading--compact">
            <h2 id="finish-result-title">检查结果</h2>
          </div>
          <ol id="gate-rail" class="gate-rail"></ol>
          <div id="finding-list" class="finding-list"></div>
        </section>

        <section id="candidate-panel" class="candidate-panel" hidden>
          <div class="finish-section-heading">
            <h2>导入修复图</h2>
            <label class="button button--ghost candidate-upload">
              选择修复图
              <input
                id="candidate-input"
                class="finish-file-input"
                type="file"
                accept="image/png,image/jpeg,image/webp"
              />
            </label>
          </div>
          <div id="candidate-comparison" class="candidate-comparison"></div>
          <div class="candidate-actions">
            <p id="candidate-status">导入修复图后，会判断是否可以交付。</p>
            <button id="approve-candidate" type="button" class="button button--primary" disabled>
              批准为交付源图
            </button>
          </div>
        </section>
      </main>

      <aside id="repair-bar" class="repair-bar" hidden>
        <div>
          <strong id="repair-title"></strong>
        </div>
        <button id="copy-repair-contract" type="button" class="button button--primary">
          复制修复指令
        </button>
      </aside>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
